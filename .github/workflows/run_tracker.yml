# Fetch prices for a given session date and update high_history (no OpenAI).
# Optional: commit and push snapshot + high_history (only when input is explicitly "true").

name: Run tracker

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Trading date (YYYY-MM-DD), e.g. 2026-06-01"
        required: true
        type: string
      commit_output:
        description: "If checked, commit and push output/snapshot.txt + high_history files"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: manual-history-only-${{ github.event.inputs.date }}
  cancel-in-progress: true

jobs:
  history-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate date format
        env:
          DATE: ${{ github.event.inputs.date }}
        run: |
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Date must be YYYY-MM-DD, got: $DATE"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker (history-only)
        run: python tracker.py --date "${{ github.event.inputs.date }}" --history-only

      # workflow_dispatch inputs are STRINGS. The string "false" is truthy in GHA expressions,
      # so never use `if: ${{ inputs.x }}` for booleans — compare to 'true' explicitly.
      - name: Commit and push outputs
        if: ${{ github.event.inputs.commit_output == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/snapshot.txt output/high_history.json output/high_history.txt
          if git diff --staged --quiet; then
            echo "No changes to snapshot or high history files."
          else
            git commit -m "chore: history-only ${{ github.event.inputs.date }} (workflow_dispatch) [skip ci]"
            git push
          fi
