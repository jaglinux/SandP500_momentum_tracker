<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S&amp;P 500 Momentum Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-dim: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    header p { margin: 0.35rem 0 0; font-size: 0.85rem; color: var(--muted); }
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    nav {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 0.75rem 0;
    }
    nav h2 {
      margin: 0;
      padding: 0.5rem 1rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.55rem 1rem;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    nav button:hover { background: rgba(59, 130, 246, 0.1); }
    nav button.active {
      background: rgba(59, 130, 246, 0.15);
      border-left-color: var(--accent);
      color: #fff;
    }
    nav button .meta {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    main {
      flex: 1;
      overflow: auto;
      padding: 1.25rem 1.5rem 2rem;
    }
    #placeholder {
      color: var(--muted);
      margin-top: 2rem;
    }
    #viewer h2 {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
      font-weight: 600;
    }
    #viewer .path {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1rem;
      font-family: ui-monospace, monospace;
    }
    #viewer pre.raw {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow: auto;
      font-size: 0.8rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #viewer .md {
      line-height: 1.55;
      max-width: 52rem;
    }
    #viewer .md table {
      border-collapse: collapse;
      font-size: 0.78rem;
      display: block;
      overflow-x: auto;
    }
    #viewer .md th, #viewer .md td {
      border: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
    }
    #viewer .md th { background: var(--panel); }
    #viewer .md h2 { margin-top: 1.5rem; font-size: 1.15rem; }
    #viewer .md h3 { margin-top: 1.25rem; font-size: 1rem; }
    .error { color: #f87171; }
    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      nav { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <h1>S&amp;P 500 Momentum Tracker</h1>
    <p id="status">Loading file list…</p>
  </header>
  <div class="layout">
    <nav id="sidebar"></nav>
    <main>
      <div id="placeholder">Select a file from the sidebar.</div>
      <div id="viewer" hidden></div>
    </main>
  </div>
  <script>
    const sidebar = document.getElementById("sidebar");
    const viewer = document.getElementById("viewer");
    const placeholder = document.getElementById("placeholder");
    const status = document.getElementById("status");
    let activeBtn = null;

    async function loadManifest() {
      for (const url of ["manifest.json", "/api/manifest"]) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (res.ok) return res.json();
        } catch (_) {}
      }
      throw new Error("manifest.json not found. Run: python generate_manifest.py");
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function renderSidebar(manifest) {
      sidebar.innerHTML = "";
      for (const section of manifest.sections || []) {
        const h2 = document.createElement("h2");
        h2.textContent = section.title;
        sidebar.appendChild(h2);
        for (const file of section.files) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.dataset.path = file.path;
          btn.innerHTML =
            file.label +
            '<span class="meta">' +
            file.path +
            " · " +
            formatSize(file.size) +
            "</span>";
          btn.addEventListener("click", () => openFile(btn, file.path));
          sidebar.appendChild(btn);
        }
      }
      const t = manifest.generated
        ? "Updated " + new Date(manifest.generated).toLocaleString()
        : "";
      status.textContent = t || "Ready";
    }

    async function openFile(btn, path) {
      if (activeBtn) activeBtn.classList.remove("active");
      btn.classList.add("active");
      activeBtn = btn;

      placeholder.hidden = true;
      viewer.hidden = false;
      viewer.innerHTML = "<p>Loading…</p>";

      try {
        const res = await fetch(path, { cache: "no-store" });
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const text = await res.text();
        const ext = path.split(".").pop().toLowerCase();

        let body = "";
        if (ext === "md") {
          body =
            '<div class="md">' +
            marked.parse(text, { gfm: true, breaks: true }) +
            "</div>";
        } else if (ext === "json") {
          try {
            body =
              '<pre class="raw">' +
              escapeHtml(JSON.stringify(JSON.parse(text), null, 2)) +
              "</pre>";
          } catch {
            body = '<pre class="raw">' + escapeHtml(text) + "</pre>";
          }
        } else {
          body = '<pre class="raw">' + escapeHtml(text) + "</pre>";
        }

        viewer.innerHTML =
          "<h2>" +
          escapeHtml(path.split("/").pop()) +
          '</h2><div class="path">' +
          escapeHtml(path) +
          "</div>" +
          body;
      } catch (err) {
        viewer.innerHTML =
          '<p class="error">Could not load ' +
          escapeHtml(path) +
          ": " +
          escapeHtml(err.message) +
          "</p>";
      }
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    loadManifest()
      .then((m) => {
        renderSidebar(m);
        const first = sidebar.querySelector("button");
        if (first) first.click();
      })
      .catch((err) => {
        status.textContent = err.message;
        status.classList.add("error");
      });
  </script>
</body>
</html>
